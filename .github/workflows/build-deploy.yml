name: build and deploy

on: ["pull_request", "push"]

jobs:
  build:
    environment: testing
    runs-on: ubuntu-latest

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: tenanthub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tenanthub_test
      TESTING: "1"
      SECRET_KEY: test-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      OTP_EXPIRE_MINUTES: "5"
      SENDGRID_API_KEY: test-sendgrid-key
      SENDER_MAIL: test@example.com
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      FRONTEND_BASEURL: http://localhost:5173
      STRIPE_SECRET_KEY: sk_test_dummy
      STRIPE_WEBHOOK_SECRET: whsec_dummy
      TWILIO_ACCOUNT_SID: AC00000000000000000000000000000000
      TWILIO_AUTH_TOKEN: test-token
      TWILIO_SERVICE_SID: VA00000000000000000000000000000000

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenanthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenanthub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: pull code
        uses: actions/checkout@v4

      - name: install python version 3.11.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: install pip
        run: python -m pip install --upgrade pip

      - name: install requirements
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest tests/ -v --tb=short

  deploy:
    needs: [build]
    environment: production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout/pull code
        uses: actions/checkout@v4

      - name: Deploy to render
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.MY_RENDER_SERVICE_ID }}
          api-key: ${{ secrets.MY_RENDER_API_KEY }}
          wait-for-success: true
