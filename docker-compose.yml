services:
  api:
    build: .
    ports:
      - 8000:8000
    depends_on:
      - db
      - redis
      - celery
    volumes:
      - .:/app
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    
  db:
    image: postgres:16
    ports:
      - 5432:5432
    env_file:
      - .env
    volumes:
      - postgres-db:/var/lib/postgresql/data

  redis:
    image: redis:7.4
    ports:
      - 6379:6379
    env_file:
      - .env
    volumes:
      - redis-data:/data

  celery:
    build: .
    env_file:
      - .env
    command: celery -A app.core.celery.celery worker --loglevel=info --pool=solo
    depends_on: 
      - db
      - redis

volumes:
  postgres-db:
  redis-data:

   
   